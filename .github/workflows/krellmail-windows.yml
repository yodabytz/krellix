name: Krellix desktop release for Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/theme/**'
      - 'src/widgets/Meter.*'
      - 'src/widgets/Chart.cpp'
      - 'src/monitors/MemMonitor.cpp'
      - 'tests/chart-panel-layout.cpp'
      - 'packaging/themes/reactor/**'
      - 'tests/theme-animation.cpp'
      - 'plugins/krellmail/**'
      - 'plugins/krellweather/**'
      - 'tests/krellweather-*.cpp'
      - 'packaging/windows/*weather.ps1'
      - 'tests/krellmail-icon.cpp'
      - 'tests/settings-lifecycle.cpp'
      - 'src/krellix/SettingsDialog.*'
      - 'packaging/windows/*mail.ps1'
      - '.github/workflows/krellmail-windows.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Get the published portable host
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'krellix-preview11.zip'
          Invoke-WebRequest 'https://repo.cerberix.org/windows/krellix-0.1.2-windows-preview.11-x86_64.zip' -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne 'ae5679504af1548c75ff34132e68afae2d0959f9be0360f68a0854345ff12325') {
            throw 'Unexpected portable host archive'
          }
          Expand-Archive $archive -DestinationPath "$env:RUNNER_TEMP\portable"
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
      - name: Build and test weather and mail
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export QT_FORCE_STDERR_LOGGING=1
          portable=$(cygpath -u "$RUNNER_TEMP")/portable/Krellix
          [[ "$(pacman -Q mingw-w64-ucrt-x86_64-qt6-base)" == 'mingw-w64-ucrt-x86_64-qt6-base 6.12.0-'* ]]
          [[ "$(g++ -dumpfullversion)" == 16.2.0 ]]
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DKRELLIX_PRERELEASE=windows-preview.12 \
            "-DKRELLIX_SENSOR_DIR=$(cygpath -m "$portable/sensors")"
          cmake --build build --target krellix settings-lifecycle krellmail-icon krellmail-integration krellweather krellweather-icons krellweather-layout krellweather-metar-test windows-core theme-animation chart-panel-layout -j 4
          ctest --test-dir build -R '^(krellmail-(icon|integration)|krellweather-(icons|layout|metar-test)|theme-animation|chart-panel-layout-(1|1\.5|2)|settings-lifecycle|windows-(core|remote-isolation))$' --output-on-failure
          # Check the plugin against the DLLs shipped beside the published host.
          cp "$portable/"*.dll build/krellmail-icon-test-host/
          offscreen=$(find /ucrt64 -path '*/platforms/qoffscreen.dll' -type f -print -quit)
          test -n "$offscreen"
          mkdir -p build/krellmail-icon-test-host/platforms
          cp "$offscreen" build/krellmail-icon-test-host/platforms/
          ctest --test-dir build -R '^krellmail-icon$' --output-on-failure
      - name: Test and package the updated portable host and plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostDir = "$env:RUNNER_TEMP\portable\Krellix"
          $sandbox = "$env:RUNNER_TEMP\mail-test"
          Copy-Item build/sensors-candidate/krellix.exe "$hostDir\krellix.exe" -Force
          New-Item -ItemType Directory "$sandbox\plugins", "$sandbox\themes", "$env:APPDATA\krellix" -Force | Out-Null
          Copy-Item build/plugins/krellmail.dll, build/plugins/krellweather.dll "$sandbox\plugins"
          $healthZip = "$env:RUNNER_TEMP\krellhealth-preview11.zip"
          Invoke-WebRequest 'https://repo.cerberix.org/windows/krellix-krellhealth-0.1.1-windows.4-x86_64.zip' -OutFile $healthZip
          if ((Get-FileHash -LiteralPath $healthZip -Algorithm SHA256).Hash -ne 'cabb5ae3c2055a8b6aafa9e3f514ca9f618f073aa89d663d044fcea3c8917f37') {
            throw 'Unexpected KrellHealth archive'
          }
          Expand-Archive -LiteralPath $healthZip -DestinationPath "$sandbox\health-package"
          $health = "$sandbox\health-package\krellhealth"
          if (Test-Path -LiteralPath "$hostDir\health") { throw 'Unexpected bundled health helper' }
          New-Item -ItemType Directory "$hostDir\health" -Force | Out-Null
          Copy-Item "$health\krellhealth.dll" "$sandbox\plugins"
          Copy-Item "$health\krellhealth-probe.exe" "$hostDir\health"
          Copy-Item packaging/themes/reactor "$sandbox\themes" -Recurse
          "[plugins]`nkrellmail\enabled=true`nkrellmail\account_count=0`nkrellhealth\enabled=true`nkrellweather\enabled=true`nkrellweather\station=" |
            Set-Content "$env:APPDATA\krellix\krellix-krellmail-test.ini" -Encoding ASCII
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $env:QT_LOGGING_RULES = 'krellix.plugin.info=true'
          $env:QT_QPA_PLATFORM = 'windows'
          $env:KRELLIX_DEV_PLUGINS = '1'
          $log = "$sandbox\startup.log"
          $app = Start-Process "$hostDir\krellix.exe" -WorkingDirectory $sandbox -PassThru `
            -ArgumentList '--instance', 'krellmail-test', '--theme', 'reactor', '--monitors', 'host,krellmail,krellweather,krellhealth' `
            -RedirectStandardError $log
          $mailPattern = 'io.krellix.krellmail.*0\.1\.7-windows\.3.*factory ready'
          $healthPattern = 'io.krellix.krellhealth.*0\.1\.1-windows\.4.*factory ready'
          $weatherPattern = 'loaded plugin.*"krellweather" "0\.1\.2-windows\.1".*factory ready'
          try {
            for ($i = 0; $i -lt 20; $i++) {
              if ($app.HasExited) { throw "Portable host exited: $($app.ExitCode)" }
              if ((Select-String -LiteralPath $log -Pattern $mailPattern -Quiet) -and
                  (Select-String -LiteralPath $log -Pattern $weatherPattern -Quiet) -and
                  (Select-String -LiteralPath $log -Pattern $healthPattern -Quiet)) { break }
              Start-Sleep -Milliseconds 500
            }
            Get-Content $log
            if (!(Select-String -LiteralPath $log -Pattern $mailPattern -Quiet) -or
                !(Select-String -LiteralPath $log -Pattern $weatherPattern -Quiet) -or
                !(Select-String -LiteralPath $log -Pattern $healthPattern -Quiet)) {
              throw 'Portable host did not load the optional plugins'
            }
            if (Select-String -LiteralPath $log -Pattern 'krellix.theme:.*(not found|failed|refusing|missing)' -Quiet) {
              throw 'Theme loading failed'
            }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }
          ./packaging/windows/package-mail.ps1 -Build "$PWD/build" -HostDirectory $hostDir `
            -HostVersion '0.1.2-windows-preview.12' -Destination "$env:RUNNER_TEMP/mail-package"
          $manifestPath = "$hostDir\extras\krelltop\manifest.json"
          if (Test-Path -LiteralPath $manifestPath) {
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            $manifest.host_version = '0.1.2-windows-preview.12'
            $manifest.host_sha256 = (Get-FileHash "$hostDir\krellix.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            $manifest | ConvertTo-Json | Set-Content -LiteralPath $manifestPath -Encoding ASCII
          }
          Remove-Item -LiteralPath "$hostDir\health\krellhealth-probe.exe"
          Remove-Item -LiteralPath "$hostDir\health"
          $healthManifestPath = "$health\manifest.json"
          $healthManifest = Get-Content -LiteralPath $healthManifestPath -Raw | ConvertFrom-Json
          $healthManifest.host_version = '0.1.2-windows-preview.12'
          $healthManifest.host_sha256 = (Get-FileHash "$hostDir\krellix.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $healthManifest | ConvertTo-Json | Set-Content -LiteralPath $healthManifestPath -Encoding ASCII
          $healthReadme = (Get-Content -LiteralPath "$health\README.md" -Raw).Replace('preview.11', 'preview.12')
          Set-Content -LiteralPath "$health\README.md" -Value $healthReadme -Encoding UTF8
          Compress-Archive -LiteralPath $health -DestinationPath "$env:RUNNER_TEMP/mail-package/krellix-krellhealth-0.1.1-windows.4-preview.12-x86_64.zip"
          Compress-Archive -LiteralPath $hostDir -DestinationPath "$env:RUNNER_TEMP/mail-package/krellix-0.1.2-windows-preview.12-x86_64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: krellix-krellix-preview12
          path: ${{ runner.temp }}/mail-package/*.zip
          if-no-files-found: error
